# MediaMTX is intentionally non-playable until the API integration adds
# authenticated, short-lived path registrations.
logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers: []

api: true
apiAddress: :9997
apiEncryption: false
apiAllowOrigins: []

metrics: false
pprof: false
playback: false

# MediaMTX pulls cameras as an RTSP client; it does not accept RTSP publishers.
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
webrtcICEServers2: []

pathDefaults:
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  rtspTransport: tcp
  record: false

# Camera paths and credential-bearing source URLs are registered at runtime.
paths: {}
