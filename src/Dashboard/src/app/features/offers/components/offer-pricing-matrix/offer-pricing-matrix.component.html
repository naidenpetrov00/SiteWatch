<section class="offer-pricing" aria-labelledby="offer-pricing-heading">
  <app-offer-pricing-matrix-summary [matrix]="matrix()" />

  <app-offer-pricing-matrix-status
    [feedback]="feedback()"
    [error]="error()"
    [collectionOutcomes]="collectionOutcomes()"
    [loading]="offersService.pricingMatrixQuery.isPending()"
    [loadError]="offersService.pricingMatrixQuery.isError()"
  />

  @if (!offersService.pricingMatrixQuery.isPending() && !offersService.pricingMatrixQuery.isError() && matrix(); as currentMatrix) {
    <app-offer-pricing-matrix-actions
      [matrix]="currentMatrix"
      [editable]="editable()"
      [isMutating]="isMutating()"
      [retailerSearch]="retailerSearch"
      [retailerResults]="retailerResults()"
      (onlinePriceCollectionRequested)="openOnlinePriceCollection()"
      (retailerSelected)="onRetailerSelected($event)"
    />

    <app-offer-pricing-matrix-collection-runs
      [runs]="offersService.onlinePriceCollectionRunsQuery.data() ?? []"
      [hasLoadError]="offersService.onlinePriceCollectionRunsQuery.isError()"
    />

    <app-offer-pricing-matrix-table
      [matrix]="currentMatrix"
      [editable]="editable()"
      [isMutating]="isMutating()"
      [forms]="forms()"
      [editingLocations]="editingLocations()"
      [savingCellKey]="savingCellKey()"
      [cellErrors]="cellErrors()"
      (retailerRemovalRequested)="removeRetailer($event.retailerId, $event.displayName)"
      (productLinkRequested)="openProductLink($event.row, $event.cell)"
      (editStarted)="startEdit($event.displayRowId, $event.row, $event.cell)"
      (editCancelled)="cancelEdit($event.displayRowId, $event.row, $event.cell)"
      (priceSaveRequested)="savePrice($event.displayRowId, $event.row, $event.cell)"
      (priceUseRequested)="usePrice($event.row, $event.cell)"
      (selectionClearRequested)="clearSelection($event)"
      (historyRequested)="openHistory($event.row, $event.cell)"
    />
  }
</section>
