<app-dialog-shell
  eyebrow="Retailer Status"
  [title]="data.activate ? 'Activate Retailer' : 'Deactivate Retailer'"
  [subtitle]="subtitle"
>
  <p>
    {{ data.activate ? 'Activate' : 'Deactivate' }} {{ data.displayName }}?
  </p>

  @if (!data.activate && data.removesFromOfferDefaults) {
    <p>
      Existing Offers retain their snapshotted retailer comparisons.
    </p>
  }

  <app-dialog-action-bar
    dialog-shell-actions
    cancelLabel="Cancel"
    [submitLabel]="data.activate ? 'Activate' : 'Deactivate'"
    (cancel)="cancel()"
    (submit)="confirm()"
  />
</app-dialog-shell>
