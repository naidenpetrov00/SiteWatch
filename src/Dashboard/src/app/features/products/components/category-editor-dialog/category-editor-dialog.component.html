<app-dialog-shell
  eyebrow="Catalog"
  [title]="isEdit ? 'Rename Category' : 'Create Category'"
  subtitle="Categories are broad administrator-managed catalog groupings."
  [closeDisabled]="saving()"
>
  <form [id]="formId" [formGroup]="form" novalidate (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="category-editor__field">
      <mat-label>Category name</mat-label>
      <input matInput formControlName="name" maxlength="200" autocomplete="off" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <mat-error>Enter a Category name of no more than 200 characters.</mat-error>
      }
    </mat-form-field>
    @if (saveError()) { <p class="category-editor__error" role="alert">{{ saveError() }}</p> }
  </form>
  <app-dialog-action-bar
    dialog-shell-actions
    [cancelDisabled]="saving()"
    [submitDisabled]="form.invalid || saving()"
    [submitLabel]="saving() ? 'Saving…' : isEdit ? 'Save Category' : 'Create Category'"
    [submitFormId]="formId"
    submitButtonType="submit"
    (cancel)="close()"
  />
</app-dialog-shell>
