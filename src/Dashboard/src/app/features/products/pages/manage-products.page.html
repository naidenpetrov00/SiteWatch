<main class="manage-products-page">
  <header class="manage-products-page__header">
    <div>
      <p class="manage-products-page__eyebrow">Administration</p>
      <h1>Manage Products</h1>
      <p class="manage-products-page__summary">Maintain concrete Products and their future retailer-search requirements.</p>
    </div>
    <div class="manage-products-page__header-actions">
      <button mat-stroked-button type="button" [matMenuTriggerFor]="catalogMenu">Manage catalog</button>
      <app-action-button label="Add Product" variant="primary" (clicked)="openAddProductDialog()" />
    </div>
    <mat-menu #catalogMenu="matMenu">
      <button mat-menu-item type="button" (click)="openCategoryManagement()">Manage Categories</button>
      <button mat-menu-item type="button" (click)="openProductTypeManagement()">Manage Product Types</button>
    </mat-menu>
  </header>

  <app-data-table tableEyebrow="Catalog" tableLabel="Manage Products" emptyMessage="No products match the current filters." filterApplyMode="search" [rows]="products()" [filteredRowsTotal]="filteredCount()" [overallRowsTotal]="totalCount()" [columns]="columns" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" [resetPageToken]="catalogFilterRevision()" (tableStateChange)="onTableStateChange($event)" (filtersCleared)="clearCatalogFilters()" (cellButtonClicked)="onCellButtonClicked($event)">
    <div data-table-filter-control class="manage-products-page__table-filter">
      <app-catalog-selector [formControl]="categoryFilterControl" kind="category" label="Filter by Category" placeholder="Choose or search Categories" />
    </div>
    <div data-table-filter-control class="manage-products-page__table-filter">
      <app-catalog-selector [formControl]="productTypeFilterControl" kind="product-type" [categoryId]="selectedCategoryId()" label="Filter by Product Type" placeholder="Choose or search Product Types" />
    </div>
  </app-data-table>
</main>
