<form
  [attr.id]="formId"
  class="edit-user-dialog__form"
  [formGroup]="userForm()"
  novalidate
  (ngSubmit)="onSubmit()"
>
  <div class="edit-user-dialog__grid">
    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--half"
    >
      <mat-label>Number Id</mat-label>
      <input name="edit-user-dialog-content-number-id" matInput formControlName="numberId" type="number" readonly  autocomplete="off"/>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--half"
    >
      <mat-label>Id</mat-label>
      <input name="edit-user-dialog-content-id" matInput formControlName="id" type="text" readonly  autocomplete="off"/>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--full"
    >
      <mat-label>Username</mat-label>
      <input name="edit-user-dialog-content-username" matInput formControlName="username" type="text"  autocomplete="username"/>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--half"
    >
      <mat-label>Email</mat-label>
      <input name="edit-user-dialog-content-email" matInput formControlName="email" type="email"  autocomplete="email"/>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--half"
    >
      <mat-label>Phone number</mat-label>
      <input name="edit-user-dialog-content-phone-number" matInput formControlName="phoneNumber" type="text"  autocomplete="tel"/>
    </mat-form-field>

    <div class="edit-user-dialog__field edit-user-dialog__field--checkbox">
      <mat-checkbox formControlName="isEmailConfirmed">Email confirmed</mat-checkbox>
    </div>

    <div class="edit-user-dialog__field edit-user-dialog__field--checkbox">
      <mat-checkbox formControlName="isPhoneNumberConfirmed">Phone confirmed</mat-checkbox>
    </div>

    <mat-form-field
      appearance="outline"
      class="edit-user-dialog__field edit-user-dialog__field--full"
    >
      <mat-label>Last login at</mat-label>
      <input name="edit-user-last-login"
        matInput
        type="text"
        [value]="formatLastLoginAt(userForm().controls.lastLoginAt.value)"
        readonly
       autocomplete="off"/>
    </mat-form-field>
  </div>
</form>
