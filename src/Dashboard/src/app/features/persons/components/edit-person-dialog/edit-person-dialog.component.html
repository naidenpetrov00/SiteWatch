<app-dialog-shell
  [eyebrow]="dialogEyebrow"
  [title]="dialogTitle"
  [subtitle]="dialogSubtitle"
>
  <form
    id="edit-person-dialog-form"
    class="edit-person-dialog__form"
    [formGroup]="personForm"
    novalidate
    (ngSubmit)="savePersonAndClose()"
  >
    <app-dialog-wizard-tabs
      [tabs]="wizardTabs"
      [selectedTabId]="selectedTabId()"
      [ariaLabel]="'Person sections'"
      (selectedTabIdChange)="setSelectedTab($event)"
    />

    <div class="edit-person-dialog__content">
      @switch (selectedTabId()) {
        @case ('primary-info') {
          <app-add-person-primary-info-section
            [personForm]="personForm"
            [syncVatNumber]="false"
          />
        }
        @case ('addresses') {
          <app-add-person-addresses-section
            [addresses]="personForm.controls.addresses"
            (addRequested)="addAddress()"
            (removeRequested)="removeAddress($event)"
          />
        }
        @case ('contacts') {
          <app-add-person-contacts-section
            [contacts]="personForm.controls.contacts"
            (addRequested)="addContact()"
            (removeRequested)="removeContact($event)"
          />
        }
        @case ('bank-accounts') {
          <app-add-person-bank-accounts-section
            [bankAccounts]="personForm.controls.bankAccounts"
            (addRequested)="addBankAccount()"
            (removeRequested)="removeBankAccount($event)"
          />
        }
      }
    </div>
  </form>

  <app-dialog-action-bar
    dialog-shell-actions
    [cancelLabel]="'Cancel'"
    [submitLabel]="submitLabel"
    [secondaryLabel]="secondarySubmitLabel"
    [showSecondary]="showSecondarySubmit"
    [submitFormId]="'edit-person-dialog-form'"
    [submitButtonType]="'submit'"
    [secondaryButtonType]="'button'"
    [submitDisabled]="!personForm.valid"
    [secondaryDisabled]="!personForm.valid"
    (cancel)="closeDialog()"
    (secondarySubmit)="savePerson()"
  />
</app-dialog-shell>
