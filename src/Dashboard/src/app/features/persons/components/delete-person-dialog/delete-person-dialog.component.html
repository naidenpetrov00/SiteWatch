<app-dialog-shell eyebrow="Administration" title="Delete Person" subtitle="This action cannot be undone.">
  <p>Delete Person #{{ person.numberId }} — {{ person.displayName }}?</p>
  <app-dialog-action-bar
    dialog-shell-actions
    cancelLabel="Cancel"
    submitLabel="Delete"
    (cancel)="cancel()"
    (submit)="confirm()"
  />
</app-dialog-shell>
