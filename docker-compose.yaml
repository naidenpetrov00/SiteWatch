x-project:
  name: sitewatch_container

services:
  database.sitewatch:
    container_name: database.sitewatch
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - "ACCEPT_EULA=Y"
      - "MSSQL_SA_PASSWORD=SuperStrongPassword1!"
    volumes:
      - ./sqlserver/data:/var/opt/mssql/data
      - ./sqlserver/log:/var/opt/mssql/log
    ports:
      - "1433:1433"
    user: root
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "SuperStrongPassword1!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
  blob.sitewatch:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: blob.sitewatch
    ports: ["10000:10000"]
    volumes:
      - ./azurelite-data/data:/data
    command: "azurite-blob --blobHost 0.0.0.0 -l /data"
  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    container_name: mediamtx.sitewatch
    init: true
    environment:
      MTX_WEBRTCLOCALUDPADDRESS: ":${MEDIAMTX_WEBRTC_MEDIA_PORT:-8189}"
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADVERTISED_HOSTS:-127.0.0.1}
      MTX_WEBRTCALLOWORIGINS: ${MEDIAMTX_WEBRTC_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      MTX_WEBRTCIPSFROMINTERFACES: "false"
    ports:
      - "127.0.0.1:${MEDIAMTX_WEBRTC_SIGNALING_PORT:-8889}:8889"
      - "${MEDIAMTX_WEBRTC_BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_WEBRTC_MEDIA_PORT:-8189}:${MEDIAMTX_WEBRTC_MEDIA_PORT:-8189}/udp"
      - "127.0.0.1:${MEDIAMTX_CONTROL_PORT:-9997}:9997"
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "/mediamtx", "--validate-conf=/mediamtx.yml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
